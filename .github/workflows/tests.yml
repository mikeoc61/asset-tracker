name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Run unit tests
        run: python -m unittest discover -v

      - name: Check Python compilation
        run: python -m compileall -q asset_tracker.py btc_macro tests

      - name: Verify core imports
        run: python -c "from btc_macro.transforms import normalize_prices; from btc_macro.yahoo import apply_current_prices"
